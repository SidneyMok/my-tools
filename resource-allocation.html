<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="资源编排台：纯前端的团队项目与人员资源编排管理工具，数据保存在本地浏览器。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<title>资源编排台 · 团队项目与人员编排</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ============================================================
   资源编排台 — 产品样式
   1. 设计令牌   2. 基础与无障碍   3. 应用外壳
   4. 项目区     5. 人员区         6. 弹层与提示
   7. 响应式     8. 动效降级
   ============================================================ */

/* ---------- 1. 设计令牌 ---------- */
:root{
  /* 中性色 */
  --c-page:#EEF1F5;
  --c-surface:#FFFFFF;
  --c-surface-alt:#F7F9FB;
  --c-ink:#14181F;
  --c-ink-2:#4A5563;
  --c-ink-3:#626D7B;
  --c-line:#DCE1E8;
  --c-line-strong:#C3CBD6;
  --c-accent:#0E5E6F;
  --c-accent-hover:#0A4A58;
  --c-accent-soft:#E2F0F3;
  --c-danger:#B4232A;
  --c-scrim:rgba(20,24,31,.42);

  /* 项目状态：缺口 / 满编 / 超编 / 未设岗位 */
  --st-gap-fg:#B4232A;  --st-gap-bg:#FDECEC;  --st-gap-bd:#F0C4C6;
  --st-full-fg:#12693C; --st-full-bg:#E6F4EC; --st-full-bd:#BFE0CD;
  --st-over-fg:#3A4A8C; --st-over-bg:#E9ECF8; --st-over-bd:#C6CDEE;
  --st-none-fg:#5A6472; --st-none-bg:#EDF0F4; --st-none-bd:#D8DEE6;

  /* 人员负载：0 空闲 / 1 轻载 / 2 正常 / 3 满载 / ≥4 超载 */
  --ld-0-fg:#5A6472; --ld-0-bg:#EDF0F4; --ld-0-bd:#D8DEE6;
  --ld-1-fg:#12693C; --ld-1-bg:#E6F4EC; --ld-1-bd:#BFE0CD;
  --ld-2-fg:#0E5E6F; --ld-2-bg:#E2F0F3; --ld-2-bd:#BBD9E0;
  --ld-3-fg:#8A5300; --ld-3-bg:#FFF3DC; --ld-3-bd:#F0DCB0;
  --ld-4-fg:#B4232A; --ld-4-bg:#FDECEC; --ld-4-bd:#F0C4C6;

  /* 字体 */
  --f-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --fs-micro:14px;
  --fs-base:16px;
  --fs-md:18px;
  --fs-lg:22px;
  --fs-xl:26px;
  --fs-display:32px;
  --lh-tight:1.3;
  --lh-body:1.6;

  /* 间距：4px 基准 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;

  /* 圆角 / 阴影 */
  --r-card:12px; --r-ctrl:8px; --r-chip:999px; --r-overlay:16px;
  --sh-raised:0 1px 2px rgba(20,24,31,.06);
  --sh-drag:0 12px 28px rgba(20,24,31,.18);
  --sh-overlay:0 24px 64px rgba(20,24,31,.22);
  --sh-panel:0 -1px 2px rgba(20,24,31,.05);

  /* 动效 */
  --dur-fast:150ms;
  --dur-base:200ms;
  --dur-slow:300ms;
  --dur-in:240ms;
  --dur-out:160ms;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --stagger:40ms;

  /* 外壳尺寸 */
  --people-w:320px;
  --people-w-collapsed:56px;
  --pad-x:var(--sp-6);
  --toast-bottom:var(--sp-4);
}

/* ---------- 2. 基础与无障碍 ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:var(--f-sans);
  font-size:var(--fs-base);
  line-height:var(--lh-body);
  color:var(--c-ink);
  background:var(--c-page);
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.visually-hidden{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.skip-link{position:absolute;inset-inline-start:var(--sp-4);top:-120px;z-index:100;background:var(--c-surface);color:var(--c-accent);border:1px solid var(--c-accent);border-radius:var(--r-ctrl);padding:var(--sp-2) var(--sp-4);text-decoration:none;font-size:var(--fs-micro);font-weight:600;transition:top var(--dur-fast) var(--ease-out)}
.skip-link:focus{top:var(--sp-2)}
:where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
.noscript{margin:var(--sp-6);padding:var(--sp-4);background:var(--st-gap-bg);border:1px solid var(--st-gap-bd);border-radius:var(--r-card);color:var(--st-gap-fg)}

/* ---------- 3. 应用外壳 ---------- */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:calc(100vh - 56px);height:calc(100dvh - 56px)}
/* 行高必须封顶：隐式 auto 行会被内容撑开，导致整页滚动而不是面板内滚动 */
.app-body{display:grid;grid-template-columns:minmax(0,1fr) var(--people-w);grid-template-rows:minmax(0,1fr);min-height:0}
.app[data-people="collapsed"] .app-body{grid-template-columns:minmax(0,1fr) var(--people-w-collapsed)}
.app-main{display:grid;grid-template-rows:minmax(0,1fr);min-height:0;min-width:0}

.app-bar{display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap;padding:var(--sp-3) var(--pad-x);background:var(--c-surface);border-bottom:1px solid var(--c-line);box-shadow:var(--sh-raised);position:relative;z-index:10}
.bar-brand{flex:none;min-width:0}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:10px;background:var(--c-accent);color:#fff}
.bar-brand-text{min-width:0}
.brand-name{display:block;font-size:var(--fs-md);font-weight:700;letter-spacing:-.01em;line-height:var(--lh-tight);white-space:nowrap}
.brand-sub{display:block;font-size:var(--fs-micro);color:var(--c-ink-3);line-height:var(--lh-tight);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-stats{margin-inline-start:auto;flex-wrap:wrap}
.bar-actions{flex:none}
/* 显式收紧数字与标题的行距，覆盖从 .bar-stats 继承下来的大 --od-gap */
.stat{min-width:60px;gap:2px;align-content:start}
.stat-num{font-size:var(--fs-lg);font-weight:700;line-height:1.05}
.stat-cap{font-size:var(--fs-micro);color:var(--c-ink-3);line-height:1.2;white-space:nowrap}
.stat[data-tone="gap"] .stat-num{color:var(--st-gap-fg)}
.stat[data-tone="load"] .stat-num{color:var(--ld-4-fg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:40px;padding:0 var(--sp-4);border-radius:var(--r-ctrl);border:1px solid transparent;background:transparent;font-size:var(--fs-base);font-weight:600;line-height:1;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ic{display:grid;place-items:center}
.btn-ic svg{width:18px;height:18px}
.btn-primary{background:var(--c-accent);color:#fff}
.btn-secondary{background:var(--c-surface);border-color:var(--c-line-strong);color:var(--c-ink)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--c-ink-2)}
.btn-danger{background:var(--c-surface);border-color:#E4B4B6;color:var(--c-danger)}
.btn-danger-solid{background:var(--c-danger);color:#fff}
@media (hover:hover){
  .btn-primary:hover:not(:disabled){background:var(--c-accent-hover)}
  .btn-secondary:hover:not(:disabled){border-color:var(--c-accent);color:var(--c-accent);background:var(--c-accent-soft)}
  .btn-ghost:hover:not(:disabled){background:var(--c-surface-alt);color:var(--c-ink);border-color:var(--c-line)}
  .btn-danger:hover:not(:disabled){background:var(--st-gap-bg)}
  .btn-danger-solid:hover:not(:disabled){background:#96191F}
}
.btn-sm{min-height:34px;padding:0 var(--sp-3);font-size:var(--fs-micro)}
.btn-block{width:100%}

.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;flex:none;border-radius:var(--r-ctrl);border:1px solid transparent;background:transparent;color:var(--c-ink-3);cursor:pointer;transition:background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
.icon-btn svg{width:18px;height:18px}
@media (hover:hover){.icon-btn:hover{background:var(--c-surface);color:var(--c-ink);border-color:var(--c-line)}}
.icon-btn[data-tone="danger"]{color:var(--c-danger)}
@media (hover:hover){.icon-btn[data-tone="danger"]:hover{background:var(--st-gap-bg);border-color:var(--st-gap-bd)}}

.region{display:flex;flex-direction:column;min-height:0;min-width:0}
.region-head{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;min-height:52px;padding:var(--sp-3) var(--pad-x);background:var(--c-surface-alt);border-bottom:1px solid var(--c-line)}
.region-title{font-size:var(--fs-md);font-weight:700;letter-spacing:-.01em;flex:none}
.region-count{flex:none;font-size:var(--fs-micro);color:var(--c-ink-2);padding:2px var(--sp-2);border:1px solid var(--c-line);border-radius:var(--r-chip);background:var(--c-surface)}
.head-tools{margin-inline-start:auto;display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.region-body{flex:1 1 auto;min-height:0;overflow:auto;padding:var(--sp-4) var(--pad-x) var(--sp-5);overscroll-behavior:contain}

.field-inline{display:inline-flex;align-items:center;gap:var(--sp-2)}
.field-label{font-size:var(--fs-micro);color:var(--c-ink-3);white-space:nowrap}
.field-wrap{position:relative;display:inline-flex;align-items:center}
.field-ic{position:absolute;inset-inline-start:var(--sp-2);display:grid;place-items:center;color:var(--c-ink-3);pointer-events:none}
.field-ic svg{width:16px;height:16px}
.field-wrap input[type="search"]{height:34px;width:170px;padding:0 var(--sp-3) 0 34px;border:1px solid var(--c-line-strong);border-radius:var(--r-ctrl);background:var(--c-surface);font-size:var(--fs-micro)}
.field-inline select{height:34px;padding:0 var(--sp-3);border:1px solid var(--c-line-strong);border-radius:var(--r-ctrl);background:var(--c-surface);font-size:var(--fs-micro);cursor:pointer;max-width:170px}
input[type="search"]::-webkit-search-cancel-button{cursor:pointer}

.hint-bar{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin:0 0 var(--sp-4);padding:var(--sp-3) var(--sp-4);border:1px solid var(--c-accent);border-radius:var(--r-card);background:var(--c-accent-soft);color:var(--c-ink);font-size:var(--fs-micro)}
.hint-bar strong{font-weight:700}
.grid-notice{margin:var(--sp-4) 0 0;padding:var(--sp-3) var(--sp-4);border:1px dashed var(--c-line-strong);border-radius:var(--r-card);background:var(--c-surface-alt);color:var(--c-ink-2);font-size:var(--fs-micro)}

.empty-state{display:grid;justify-items:center;gap:var(--sp-3);padding:var(--sp-12) var(--sp-6);text-align:center}
.empty-ic{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--c-surface);border:1px solid var(--c-line);color:var(--c-ink-3)}
.empty-ic svg{width:26px;height:26px}
.empty-title{font-size:var(--fs-md);font-weight:700}
.empty-text{font-size:var(--fs-micro);color:var(--c-ink-2);max-width:44ch}
.empty-inline{padding:var(--sp-8) var(--sp-3)}

/* ---------- 4. 项目区 ---------- */
.project-grid{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));align-items:start}
.pcard{display:flex;flex-direction:column;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-card);overflow:hidden;transition:box-shadow var(--dur-base) var(--ease-out),border-color var(--dur-base) var(--ease-out)}
.pcard[data-status="gap"]{--st-fg:var(--st-gap-fg);--st-bg:var(--st-gap-bg);--st-bd:var(--st-gap-bd)}
.pcard[data-status="full"]{--st-fg:var(--st-full-fg);--st-bg:var(--st-full-bg);--st-bd:var(--st-full-bd)}
.pcard[data-status="over"]{--st-fg:var(--st-over-fg);--st-bg:var(--st-over-bg);--st-bd:var(--st-over-bd)}
.pcard[data-status="none"]{--st-fg:var(--st-none-fg);--st-bg:var(--st-none-bg);--st-bd:var(--st-none-bd)}
.pcard-bar{height:3px;flex:none;background:var(--st-fg)}
.pcard-head{display:grid;gap:var(--sp-2);padding:var(--sp-3);background:var(--st-bg);border-bottom:1px solid var(--st-bd)}
.pcard-title-row{display:flex;align-items:center;gap:var(--sp-2)}
.pname{flex:1 1 0;min-width:0;height:30px;padding:0 var(--sp-2);border:1px solid transparent;border-radius:var(--r-ctrl);background:transparent;font-size:var(--fs-base);font-weight:700;letter-spacing:-.01em;line-height:var(--lh-tight);color:var(--c-ink);cursor:text;text-overflow:ellipsis;transition:background-color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
.pname:hover{background:rgba(255,255,255,.7);border-color:var(--st-bd)}
.pname:focus{background:var(--c-surface);border-color:var(--c-accent)}
.badge{display:inline-flex;align-items:center;gap:var(--sp-1);flex:none;padding:3px var(--sp-2);border-radius:var(--r-chip);border:1px solid var(--st-bd);background:var(--c-surface);color:var(--st-fg);font-size:var(--fs-micro);font-weight:700;white-space:nowrap}
.badge svg{width:14px;height:14px;flex:none}
.progress{display:grid;gap:2px}
.progress-track{height:5px;border-radius:var(--r-chip);background:rgba(20,24,31,.12);overflow:hidden}
.progress-fill{display:block;height:100%;border-radius:var(--r-chip);background:var(--st-fg);transform-origin:left center;transform:scaleX(var(--p,0));transition:transform var(--dur-slow) var(--ease-out)}
.progress-text{font-size:var(--fs-micro);color:var(--c-ink-2)}

.pcard-toggle{flex:none}
.pcard-toggle svg{transform:rotate(90deg);transition:transform var(--dur-fast) var(--ease-out)}
.pcard[data-collapsed="true"] .pcard-toggle svg{transform:rotate(0deg)}
.pcard[data-collapsed="true"] .rr-list,
.pcard[data-collapsed="true"] .pcard-foot{display:none}
/* 收起态不再需要头部的分隔线，否则会和卡片底边叠成双线 */
.pcard[data-collapsed="true"] .pcard-head{border-bottom:0}
/* 拖拽或点选分配期间，收起的卡片临时展开岗位区，避免「看得见项目、放不下人」的死区 */
body.is-dragging .pcard[data-collapsed="true"] .rr-list,
body.has-selection .pcard[data-collapsed="true"] .rr-list{display:flex}
body.is-dragging .pcard[data-collapsed="true"] .pmini-row,
body.has-selection .pcard[data-collapsed="true"] .pmini-row{display:none}
.pmini-row{display:none;flex-wrap:wrap;gap:var(--sp-1)}
.pcard[data-collapsed="true"] .pmini-row{display:flex}
.pmini{display:inline-flex;align-items:center;gap:var(--sp-1);max-width:100%;height:24px;padding:0 var(--sp-2);border:1px solid var(--pm-bd,var(--c-line));border-radius:var(--r-chip);background:var(--c-surface);color:var(--pm-fg,var(--c-ink-2));font-size:var(--fs-micro);font-weight:600}
.pmini[data-status="ok"]{--pm-fg:var(--st-full-fg);--pm-bd:var(--st-full-bd)}
.pmini[data-status="gap"]{--pm-fg:var(--st-gap-fg);--pm-bd:var(--st-gap-bd)}
.pmini[data-status="over"]{--pm-fg:var(--st-over-fg);--pm-bd:var(--st-over-bd)}
.pmini-role{display:block;max-width:8em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pmini-num{display:block;flex:none;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.rr-list{display:flex;flex-direction:column}
.rolerow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp-1) var(--sp-2);padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--c-line)}
.rolerow:last-child{border-bottom:0}
.rolerow[data-status="ok"]{--rr-fg:var(--st-full-fg)}
.rolerow[data-status="gap"]{--rr-fg:var(--st-gap-fg)}
.rolerow[data-status="over"]{--rr-fg:var(--st-over-fg)}
.rr-dot{width:9px;height:9px;margin-top:6px;flex:none;background:var(--rr-fg,var(--c-line-strong))}
.rolerow[data-status="ok"] .rr-dot{border-radius:50%}

    while (seenPerson[id]) { id = uid('p'); }
    seenPerson[id] = true;
    var role = normalizeRole(String(p.role == null ? '' : p.role).trim().slice(0, ROLE_MAX));
    out.people.push({ id: id, name: name.slice(0, PERSON_NAME_MAX), role: role || '其他' });
  });
  var seenProject = {};
  raw.projects.forEach(function (pr) {
    if (!pr || typeof pr !== 'object') return;
    var name = String(pr.name == null ? '' : pr.name).trim();
    if (!name) return;
    var id = String(pr.id || uid('j'));
    while (seenProject[id]) { id = uid('j'); }
    seenProject[id] = true;
    var reqs = [];
    var reqIds = {};
    (Array.isArray(pr.requirements) ? pr.requirements : []).forEach(function (r) {
      if (!r || typeof r !== 'object') return;
      var role = normalizeRole(String(r.role == null ? '' : r.role).trim().slice(0, ROLE_MAX));
      if (!role) return;
      var rid = String(r.id || uid('r'));
      while (reqIds[rid]) { rid = uid('r'); }
      reqIds[rid] = true;
      reqs.push({ id: rid, role: role, count: clampInt(r.count, 0, COUNT_MAX) });
    });
    var seenPair = {};
    var assigns = [];
    (Array.isArray(pr.assignments) ? pr.assignments : []).forEach(function (a) {
      if (!a || typeof a !== 'object') return;
      var rid = String(a.requirementId == null ? '' : a.requirementId);
      var pid = String(a.personId == null ? '' : a.personId);
      if (!reqIds[rid] || !seenPerson[pid]) return;
      var key = rid + '|' + pid;
      if (seenPair[key]) return;
      seenPair[key] = true;
      assigns.push({ id: String(a.id || uid('a')), requirementId: rid, personId: pid });
    });
    out.projects.push({ id: id, name: name.slice(0, PROJECT_NAME_MAX), requirements: reqs, assignments: assigns, collapsed: !!pr.collapsed });
  });
  return out;
}

/* ---------- D. 派生计算 ---------- */
function personById(id) { return byId(state.people, id); }
function projectById(id) { return byId(state.projects, id); }
function reqById(project, rid) { return byId(project.requirements || [], rid); }

function loadKey(n) { return n <= 0 ? '0' : (n >= 4 ? '4' : String(n)); }
function loadLabel(n) { return LOADS[parseInt(loadKey(n), 10)].label + ' ' + n + ' 项'; }

function projectStats(project) {
  var gap = 0, over = 0, need = 0, filled = 0;
  var assigns = project.assignments || [];
  var rows = (project.requirements || []).map(function (r) {
    var n = 0;
    for (var i = 0; i < assigns.length; i++) { if (assigns[i].requirementId === r.id) n++; }
    need += r.count;
    filled += Math.min(n, r.count);
    var g = Math.max(0, r.count - n);
    var o = Math.max(0, n - r.count);
    gap += g; over += o;
    return { req: r, assigned: n, gap: g, over: o, status: n < r.count ? 'gap' : (n > r.count ? 'over' : 'ok') };
  });
  var status = need === 0 ? 'none' : (gap > 0 ? 'gap' : (over > 0 ? 'over' : 'full'));
  return { rows: rows, gap: gap, over: over, need: need, filled: filled, status: status, pct: need ? Math.min(1, filled / need) : 0 };
}

function projectStatusLabel(st) {
  if (st.status === 'none') return '未设岗位';
  if (st.status === 'gap') return '缺 ' + st.gap + ' 人';
  if (st.status === 'over') return '超编 ' + st.over + ' 人';
  return '满编';
}
function statusIconName(status) {
  return status === 'gap' ? 'stGap' : (status === 'over' ? 'stOver' : (status === 'full' ? 'stFull' : 'stNone'));
}

function personAssignmentLoad(personId) {
  var count = 0;
  state.projects.forEach(function (p) {
    var list = p.assignments || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].personId === personId) { count++; }
    }
  });
  return count;
}

function personAssignments(personId) {
  var out = [];
  state.projects.forEach(function (p) {
    (p.assignments || []).forEach(function (a) {
      if (a.personId !== personId) return;
      var r = reqById(p, a.requirementId);
      if (!r) return;
      out.push({ project: p, req: r, assignment: a });
    });
  });
  return out;
}

function isAssigned(projectId, reqId, personId) {
  var p = projectById(projectId);
  if (!p) return false;
  return (p.assignments || []).some(function (a) { return a.requirementId === reqId && a.personId === personId; });
}

function allRoles() {
  var seen = {}, out = [];
  BASE_ROLES.forEach(function (r) { if (!seen[r]) { seen[r] = true; out.push(r); } });
  state.people.forEach(function (p) { if (p.role && !seen[p.role]) { seen[p.role] = true; out.push(p.role); } });
  state.projects.forEach(function (pr) {
    (pr.requirements || []).forEach(function (r) { if (r.role && !seen[r.role]) { seen[r.role] = true; out.push(r.role); } });
  });
  return out;
}

function boardSummary() {
  var gap = 0, over = 0, loaded = 0;
  state.projects.forEach(function (p) { var s = projectStats(p); gap += s.gap; over += s.over; });
  state.people.forEach(function (pe) { if (personAssignmentLoad(pe.id) >= 4) loaded++; });
  return { projects: state.projects.length, people: state.people.length, gap: gap, over: over, loaded: loaded };
}

var pendingFocusKey = null;
var focusRetry = 0;
function captureFocus() {
  pendingFocusKey = null;
  focusRetry = 0;
  var a = document.activeElement;
  if (!a || a === document.body || !a.getAttribute) return;
  var k = a.getAttribute('data-focus-key');
  if (k) pendingFocusKey = k;
}
function restoreFocus() {
  if (!pendingFocusKey) return;
  var cur = document.activeElement;
  if (cur && cur !== document.body) { pendingFocusKey = null; focusRetry = 0; return; }
  var key = pendingFocusKey.split('"').join('');
  var node = document.querySelector('[data-focus-key="' + key + '"]');
  if (!node) {
    /* 目标节点可能由随后完成的批量渲染补出，保留 key 再重试几帧 */
    if (focusRetry++ < 3) { requestAnimationFrame(restoreFocus); }
    else { pendingFocusKey = null; focusRetry = 0; }
    return;
  }
  pendingFocusKey = null;
  focusRetry = 0;
  try { node.focus({ preventScroll: true }); } catch (e) { node.focus(); }
}

function announce(msg) {
  var n = el.liveRegion;

var batchToken = 0;
function renderProjects() {
  var flash = ui.flashProjectId; ui.flashProjectId = null;
  var total = state.projects.length;
  var list = visibleProjects();
  var filtering = ui.projectQuery.trim() !== '' || ui.projectStatus !== 'all';
  el.projectsCount.textContent = total + ' 个' + (list.length !== total ? '（筛出 ' + list.length + '）' : '');

  if (list.length === 0) {
    batchToken++;
    el.projectGrid.innerHTML = '';
    el.gridNotice.hidden = true;
    el.projectsEmpty.hidden = false;
    if (total === 0) {
      el.projectsEmptyTitle.textContent = '还没有项目';
      el.projectsEmptyText.textContent = '新建第一个项目，系统会默认配好「产品 ×1、开发 ×2、测试 ×1」的岗位需求。';
    } else {
      el.projectsEmptyTitle.textContent = '没有符合条件的项目';
      el.projectsEmptyText.textContent = filtering ? '试试清空搜索词，或把状态筛选切回「全部状态」。' : '新建一个项目开始编排人员。';
    }
    restoreFocus();
    return;
  }
  el.projectsEmpty.hidden = true;

  var shown = list.slice(0, RENDER_LIMIT);
  var token = ++batchToken;
  el.projectGrid.innerHTML = '';
  var i = 0;
  (function step() {
    if (token !== batchToken) return;
    var end = Math.min(i + RENDER_BATCH, shown.length);
    var html = '';
    for (; i < end; i++) { html += projectCardHTML(shown[i], flash); }
    el.projectGrid.insertAdjacentHTML('beforeend', html);
    if (i < shown.length) { requestAnimationFrame(step); }
    else { afterProjectRender(list.length, shown.length, token); }
  })();
}

function afterProjectRender(matched, shownCount, token) {
  if (token !== batchToken) return;
  if (matched > shownCount) {
    el.gridNotice.hidden = false;
    el.gridNotice.textContent = '一次最多渲染 ' + shownCount + ' 个项目（当前符合筛选的有 ' + matched + ' 个）。请用上方搜索或状态筛选缩小范围。';
  } else {
    el.gridNotice.hidden = true;
  }
  var alive = {};
  state.projects.forEach(function (p) { alive[p.id] = true; });
  Object.keys(prevStatus).forEach(function (k) { if (!alive[k]) { delete prevStatus[k]; } });
  restoreFocus();
}

function onDialogKeydown(e) {

function onOverlayClick(e) {

    n.classList.add('is-out');
    setTimeout(function () { if (n.parentNode) { n.parentNode.removeChild(n); } }, 200);

      cancel: function () { return true; },
      'add-req': function (api) {
        syncFromForm(api);
        var row = { id: uid('r'), role: '', count: 1 };
        draft.reqs.push(row);
        refreshEditor(api, null);
        api.focusKey('[data-role="' + row.id + '"]');
        return false;
      },
      'reset-req': function (api) {
        syncFromForm(api);
        var used = {};
        draft.reqs.forEach(function (r) { used[String(r.role).trim()] = r; });
        draft.reqs = DEFAULT_REQS.map(function (d) {
          var ex = used[d.role];
          return ex ? { id: ex.id, role: ex.role, count: ex.count } : { id: uid('r'), role: d.role, count: d.count };
        });
        clearErrors(api.root);
        refreshEditor(api, null);
        return false;
      },
      inc: function (api, act) { syncFromForm(api); clearErrors(api.root); stepReq(api, act.getAttribute('data-req-id'), 1); return false; },
      dec: function (api, act) { syncFromForm(api); clearErrors(api.root); stepReq(api, act.getAttribute('data-req-id'), -1); return false; },
      'del-req': function (api, act) {
        syncFromForm(api);
        var rid = act.getAttribute('data-req-id');
        draft.reqs = draft.reqs.filter(function (r) { return r.id !== rid; });
        clearErrors(api.root);
        refreshEditor(api, null);
        return false;
      },
      save: function (api) {
        syncFromForm(api);
        clearErrors(api.root);
        var errs = validate();
        if (errs.length) {
          var summary = [];
          errs.forEach(function (e) {
            if (e.field) { setFieldError(api.root, e.field, e.msg); }
            if (e.summary) { summary.push(e.summary); }
          });
          if (summary.length) { showSummary(api.root, summary); }
          draft.reqs.forEach(function (r) {
            if (r.blank) { var n = $('[data-role="' + r.id + '"]', api.root); if (n) { n.setAttribute('aria-invalid', 'true'); } }
          });
          var first = $('[aria-invalid="true"]', api.root);
          if (first) { first.focus(); }
          return false;
        }
        var name = String(draft.name).trim().slice(0, PROJECT_NAME_MAX);
        var reqs = draft.reqs.map(function (r) {
          return { id: r.id, role: String(r.role).trim().slice(0, ROLE_MAX), count: clampInt(r.count, 0, COUNT_MAX) };
        });
        var slots = reqs.reduce(function (s, r) { return s + r.count; }, 0);
        if (project) {
          var before = (project.assignments || []).length;
          project.name = name;
          project.requirements = reqs;
          var keep = {};
          reqs.forEach(function (r) { keep[r.id] = true; });
          project.assignments = (project.assignments || []).filter(function (a) { return keep[a.requirementId]; });
          var dropped = before - project.assignments.length;
          ui.flashProjectId = project.id;
          save(); render();
          toast('success', '项目已更新', '「' + name + '」现有 ' + reqs.length + ' 个岗位、' + slots + ' 个名额。' + (dropped > 0 ? ('已解除 ' + dropped + ' 条随岗位删除的分配。') : ''));
        } else {
          var np = { id: uid('j'), name: name, requirements: reqs, assignments: [], collapsed: false };
          state.projects.push(np);
          ui.flashProjectId = np.id;
          save(); render();
          toast('success', '项目已创建', '「' + name + '」共 ' + reqs.length + ' 个岗位、' + slots + ' 个名额，现在可以从下方人员区把人拖进去了。');
        }
        return true;
      }
    }
  });
}

function personRoleOptions(current) {
  var seen = {};
  var out = [{ value: '', label: '请选择岗位' }];
  allRoles().forEach(function (r) { if (!seen[r]) { seen[r] = true; out.push({ value: r, label: r }); } });
  if (current && !seen[current]) { seen[current] = true; out.push({ value: current, label: current }); }
  out.push({ value: CUSTOM_ROLE_VALUE, label: '自定义岗位…' });
  return out;
}

      { id: 'save', label: isNew ? '创建人员' : '保存修改', variant: 'primary' }
    ],
    handlers: {
      cancel: function () { return true; },
      save: function (api) {
        var name = String(api.value('name') || '').trim();
        var picked = String(api.value('role') || '');
        var isCustom = picked === CUSTOM_ROLE_VALUE;
        var roleField = isCustom ? 'roleCustom' : 'role';
        var role = (isCustom ? String(api.value('roleCustom') || '') : picked).trim();
        clearErrors(api.root);
        var bad = null;
        if (!name) { setFieldError(api.root, 'name', '请填写姓名。'); bad = 'name'; }
        else if (name.length > PERSON_NAME_MAX) { setFieldError(api.root, 'name', '姓名最多 ' + PERSON_NAME_MAX + ' 个字，请缩短或使用常用称呼。'); bad = bad || 'name'; }
        if (!role) { setFieldError(api.root, roleField, isCustom ? '请填写自定义岗位名，例如 设计、运维。' : '请选择岗位；列表里没有就选「自定义岗位…」再填写。'); bad = bad || roleField; }
        else if (role.length > ROLE_MAX) { setFieldError(api.root, roleField, '岗位名最多 ' + ROLE_MAX + ' 个字。'); bad = bad || roleField; }
        if (bad) { api.focusKey('[data-field="' + bad + '"]'); return false; }

/* ---------- H. 动作与数据操作 ---------- */
function assignPerson(projectId, reqId, personId) {
  var p = projectById(projectId);
  var pe = personById(personId);
  if (!p || !pe) { toast('error', '无法分配', '找不到对应的项目或人员，看板可能刚刚变动，请重试。'); return false; }
  var r = reqById(p, reqId);
  if (!r) { toast('error', '无法分配', '「' + p.name + '」里找不到这个岗位，它可能已被删除。'); return false; }
  if (isAssigned(projectId, reqId, personId)) {
    toast('warn', pe.name + ' 已在该岗位', '「' + p.name + '」的 ' + r.role + ' 岗位已经排了 ' + pe.name + '，不需要重复分配。');
    return false;
  }
  p.assignments.push({ id: uid('a'), requirementId: reqId, personId: personId });
  ui.selectedPersonId = null;
  save();
  var st = projectStats(p);
  var n = personAssignmentLoad(personId);
  ui.flashProjectId = null;
  render();
  toast('success', '已把 ' + pe.name + ' 排进 ' + r.role + ' 岗位',
    '项目「' + p.name + '」现在' + projectStatusLabel(st) + '；' + pe.name + ' ' + loadLabel(n) + '。');
  return true;
}

function unassignPerson(projectId, reqId, personId) {
  var p = projectById(projectId);
  var pe = personById(personId);
  if (!p || !pe) { return; }
  var before = p.assignments.length;
  p.assignments = p.assignments.filter(function (a) {
    if (a.personId !== personId) { return true; }
    if (reqId && a.requirementId !== reqId) { return true; }
    return false;
  });
  if (p.assignments.length === before) { toast('warn', '没有找到这条分配', '它可能已经被移除了。'); render(); return; }
  save();
  var r = reqId ? reqById(p, reqId) : null;
  var st = projectStats(p);
  var n = personAssignmentLoad(personId);
  render();
  toast('info', '已把 ' + pe.name + ' 移出',
    '「' + p.name + '」' + (r ? ('的 ' + r.role + ' 岗位') : '') + '，项目现在' + projectStatusLabel(st) + '；' + pe.name + ' ' + loadLabel(n) + '。');
}

function changeCount(projectId, reqId, delta) {
  var p = projectById(projectId);
  if (!p) { return; }
  var r = reqById(p, reqId);
  if (!r) { return; }
  var next = clampInt(r.count + delta, 0, COUNT_MAX);
  if (next === r.count) { return; }
  r.count = next;
  save();
  render();
  var st = projectStats(p);
  var row = null;
  st.rows.forEach(function (x) { if (x.req.id === reqId) { row = x; } });
  var msg = '「' + p.name + '」' + r.role + ' 需求 ' + r.count + ' 人';
  if (row) {
    msg += '，已分配 ' + row.assigned + ' 人，' +
      (row.gap > 0 ? ('还缺 ' + row.gap + ' 人') : (row.over > 0 ? ('超出 ' + row.over + ' 人') : '人数已满足'));
  }
  announce(msg + '；项目整体' + projectStatusLabel(st) + '。');
}

function addRoleViaDialog(projectId) {
  var p = projectById(projectId);
  if (!p) { return; }
  projectDialog(p, { addRow: true });
}

function zoneClick(projectId, reqId) {
  if (ui.selectedPersonId) { assignPerson(projectId, reqId, ui.selectedPersonId); }
  else { pickPersonDialog(projectId, reqId); }
}

function deleteProject(projectId) {
  var p = projectById(projectId);
  if (!p) { return; }
  var n = p.assignments.length;
  var name = p.name;
  confirmDialog({
    title: '删除项目',
    subtitle: name,
    message: '确定要删除项目「' + name + '」吗？',
    detail: n > 0
      ? ('该项目当前有 ' + n + ' 条人员分配，删除后这些分配会一并解除（人员本身不会被删除）。此操作无法撤销。')
      : '该项目还没有人员分配。此操作无法撤销。',
    confirmLabel: '删除项目',
    danger: true,
    onConfirm: function () {
      state.projects = state.projects.filter(function (x) { return x.id !== projectId; });
      delete prevStatus[projectId];
      save(); render();
      toast('success', '已删除项目', '「' + name + '」' + (n > 0 ? ('及其 ' + n + ' 条人员分配') : '') + '已从看板移除。');
    }
  });
}

function deletePerson(personId) {
  var pe = personById(personId);
  if (!pe) { return; }
  var items = personAssignments(personId);
  var n = personAssignmentLoad(personId);
  var name = pe.name;
  confirmDialog({
    title: '删除人员',
    subtitle: name + ' · ' + pe.role,
    message: '确定要删除「' + name + '」吗？',
    detail: items.length > 0
      ? (name + ' 当前有 ' + n + ' 条分配，删除后这些岗位会立刻出现缺口。此操作无法撤销。')
      : (name + ' 目前没有参与任何项目。此操作无法撤销。'),
    confirmLabel: '删除人员',
    danger: true,
    onConfirm: function () {
      state.people = state.people.filter(function (x) { return x.id !== personId; });
      state.projects.forEach(function (p) {
        p.assignments = p.assignments.filter(function (a) { return a.personId !== personId; });
      });
      if (ui.selectedPersonId === personId) { ui.selectedPersonId = null; }
      save(); render();
      toast('success', '已删除人员', '「' + name + '」' + (items.length > 0 ? ('及其 ' + items.length + ' 条分配') : '') + '已移除。');
    }
  });
}

function pad2(n) { return n < 10 ? '0' + n : String(n); }

function exportJSON() {
  try {
    var d = new Date();
    var stamp = '' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());
    var payload = JSON.stringify({
      app: 'resboard',
      version: SCHEMA,
      exportedAt: d.toISOString(),
      projects: state.projects,
      people: state.people
    }, null, 2);
    var blob = new Blob([payload], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'resource-board-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    toast('success', '已导出 JSON', '文件名 resource-board-' + stamp + '.json，含 ' + state.projects.length + ' 个项目、' + state.people.length + ' 名人员。');
  } catch (e) {
    toast('error', '导出失败', '浏览器阻止了文件下载，请检查下载权限后重试。');
  }
}

function handleImportFile(file) {
  if (!file) { return; }
  var reader;
  try { reader = new FileReader(); }
  catch (e) { toast('error', '导入失败', '当前浏览器不支持读取本地文件。'); return; }
  reader.onload = function () {
    var parsed = null;
    try { parsed = JSON.parse(String(reader.result)); } catch (e) { parsed = null; }
    if (!parsed) { toast('error', '导入失败：不是合法的 JSON', '请确认选择的是本工具导出的 .json 文件，文件可能在传输中被截断。'); return; }
    var next = normalize(parsed);
    if (!next) { toast('error', '导入失败：结构不符合要求', '文件需要包含 projects 与 people 两个数组，且每个条目带有非空的 name 字段。'); return; }
    confirmDialog({
      title: '导入并覆盖当前数据？',
      message: '文件里包含 ' + next.projects.length + ' 个项目、' + next.people.length + ' 名人员。',
      detail: '导入会覆盖当前看板的全部内容（' + state.projects.length + ' 个项目、' + state.people.length + ' 名人员）。建议先导出一次当前数据作为备份。此操作无法撤销。',
      confirmLabel: '覆盖并导入',
      danger: true,
      onConfirm: function () {
        state = next;
        prevStatus = {};
        ui.selectedPersonId = null;
        save(); render();
        toast('success', '导入完成', '已载入 ' + state.projects.length + ' 个项目、' + state.people.length + ' 名人员。');
      }
    });
  };
  reader.onerror = function () { toast('error', '读取文件失败', '浏览器无法读取该文件，请重试或换一份导出文件。'); };
  try { reader.readAsText(file, 'utf-8'); }
  catch (e) { toast('error', '读取文件失败', '浏览器不支持以文本方式读取该文件。'); }
}

/* ---------- I. 事件与启动 ---------- */
var currentZone = null;

function debounce(fn, ms) {
  var t = null;
  return function () {
    var self = this, args = arguments;
    if (t) { clearTimeout(t); }
    t = setTimeout(function () { t = null; fn.apply(self, args); }, ms);
  };
}

function toggleSelect(personId) {
  var pe = personById(personId);
  if (!pe) { return; }
  ui.selectedPersonId = (ui.selectedPersonId === personId) ? null : personId;
  render();
}

/* ---------- 人员卡「…」操作菜单（全页共享一个弹层） ---------- */
var ppMenuState = { personId: null, anchor: null };
function ppMenuEl() {
  var m = document.getElementById('ppMenu');
  if (m) { return m; }
  m = document.createElement('div');
  m.id = 'ppMenu';
  m.className = 'pp-menu';
  m.setAttribute('role', 'menu');
  m.setAttribute('aria-label', '人员操作');
  m.hidden = true;
  m.innerHTML =
    '<button type="button" class="pp-menu-item" role="menuitem" data-action="assign">' + icon('target') + '<span>分配到岗位</span></button>' +
    '<button type="button" class="pp-menu-item" role="menuitem" data-action="detail">' + icon('eye') + '<span>查看详情</span></button>' +
    '<button type="button" class="pp-menu-item" role="menuitem" data-tone="danger" data-action="delete-person">' + icon('trash') + '<span>删除人员</span></button>';
  document.body.appendChild(m);
  return m;
}
function ppMenuOpen() { return !!ppMenuState.personId; }
function openPpMenu(btn) {
  var pid = btn.getAttribute('data-person-id');
  var m = ppMenuEl();
  ppMenuState.personId = pid;
  ppMenuState.anchor = btn;
  var items = m.querySelectorAll('.pp-menu-item');
  for (var i = 0; i < items.length; i++) {
    items[i].setAttribute('data-person-id', pid);
    items[i].setAttribute('data-focus-key', 'menu:' + pid);
  }
  btn.setAttribute('aria-expanded', 'true');
  m.hidden = false;
  var r = btn.getBoundingClientRect();
  var mw = m.offsetWidth, mh = m.offsetHeight;
  var left = Math.min(Math.max(8, r.right - mw), Math.max(8, window.innerWidth - mw - 8));
  var top = r.bottom + 4;
  if (top + mh > window.innerHeight - 8) { top = Math.max(8, r.top - mh - 4); }
  m.style.left = Math.round(left) + 'px';
  m.style.top = Math.round(top) + 'px';
  if (items[0]) { try { items[0].focus({ preventScroll: true }); } catch (e) { items[0].focus(); } }
  announce('已展开操作菜单，可用上下方向键选择');
}
function closePpMenu(refocusAnchor) {
  var m = document.getElementById('ppMenu');
  var anchor = ppMenuState.anchor;
  ppMenuState.personId = null;
  ppMenuState.anchor = null;
  if (m) { m.hidden = true; }
  if (anchor && anchor.setAttribute) { anchor.setAttribute('aria-expanded', 'false'); }
  if (refocusAnchor && anchor && anchor.isConnected) {
    try { anchor.focus({ preventScroll: true }); } catch (e) { anchor.focus(); }
  }
}
function togglePpMenu(btn) {
  if (ppMenuOpen() && ppMenuState.anchor === btn) { closePpMenu(true); return; }
  if (ppMenuOpen()) { closePpMenu(true); }
  openPpMenu(btn);
}
function onPpMenuKeydown(e) {
  var m = e.target && e.target.closest ? e.target.closest('.pp-menu') : null;
  if (!m) { return; }
  var items = Array.prototype.slice.call(m.querySelectorAll('.pp-menu-item'));
  if (!items.length) { return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    var idx = items.indexOf(document.activeElement);
    var next = e.key === 'ArrowDown' ? (idx + 1) % items.length : (idx - 1 + items.length) % items.length;
    items[next].focus();
  } else if (e.key === 'Home') {
    e.preventDefault();
    items[0].focus();
  } else if (e.key === 'End') {
    e.preventDefault();
    items[items.length - 1].focus();
  }
}

function onActionClick(e) {
  if (dialogOpen()) { return; }
  var t0 = e.target && e.target.closest ? e.target.closest('[data-action]') : null;
  var isMenuAnchor = !!t0 && t0.getAttribute('data-action') === 'person-menu';
  var clickInMenu = e.target && e.target.closest ? e.target.closest('.pp-menu') : null;
  if (ppMenuOpen() && !clickInMenu && !isMenuAnchor) { closePpMenu(false); }
  var t = t0;
  if (!t) { return; }
  var action = t.getAttribute('data-action');
  if (action === 'grip') { return; }
  if (action === 'person-menu') { e.preventDefault(); togglePpMenu(t); return; }
  if (clickInMenu) { closePpMenu(true); }
  var pid = t.getAttribute('data-project-id');
  var rid = t.getAttribute('data-req-id');
  var personId = t.getAttribute('data-person-id');
  e.preventDefault();
  switch (action) {
    case 'select': toggleSelect(personId); break;
    case 'assign': assignDialog(personId); break;
    case 'detail': personDetailDialog(personId); break;
    case 'delete-person': deletePerson(personId); break;
    case 'unassign': unassignPerson(pid, rid, personId); break;
    case 'inc': changeCount(pid, rid, 1); break;
    case 'dec': changeCount(pid, rid, -1); break;
    case 'pick': pickPersonDialog(pid, rid); break;
    case 'zone': zoneClick(pid, rid); break;
    case 'toggle-project': toggleProjectCollapsed(pid); break;
    case 'add-role': addRoleViaDialog(pid); break;
    case 'edit-project': var pj = projectById(pid); if (pj) { projectDialog(pj); } break;
    case 'delete-project': deleteProject(pid); break;
    case 'clear-select': ui.selectedPersonId = null; render(); break;
    default: break;
  }
}

function onProjectNameChange(e) {
  var inp = e.target && e.target.closest ? e.target.closest('.pname') : null;
  if (!inp) { return; }
  var p = projectById(inp.getAttribute('data-project-id'));
  if (!p) { return; }
  var v = String(inp.value || '').trim().slice(0, PROJECT_NAME_MAX);
  if (!v) { toast('warn', '项目名不能为空', '已恢复为「' + p.name + '」。'); render(); return; }
  if (v === p.name) { return; }
  if (state.projects.some(function (x) { return x.id !== p.id && x.name === v; })) {
    toast('warn', '已有同名项目', '「' + v + '」已被占用，已恢复为「' + p.name + '」。');
    render();
    return;
  }
  p.name = v;
  save(); render();
  toast('success', '项目已重命名', '现在叫「' + v + '」。');
}

function onProjectNameKeydown(e) {
  var inp = e.target && e.target.closest ? e.target.closest('.pname') : null;
  if (!inp) { return; }
  if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
  else if (e.key === 'Escape') {
    e.preventDefault();
    var p = projectById(inp.getAttribute('data-project-id'));
    if (p) { inp.value = p.name; }
    inp.blur();
  }
}

function markZones(personId) {
  $$('.rr-zone').forEach(function (z) {
    z.classList.toggle('is-bad', isAssigned(z.getAttribute('data-project-id'), z.getAttribute('data-req-id'), personId));
  });
}
function endDrag() {
  ui.dragPersonId = null;
  currentZone = null;
  document.body.classList.remove('is-dragging');
  $$('.person-card.is-dragging').forEach(function (n) { n.classList.remove('is-dragging'); });
  $$('.rr-zone').forEach(function (z) { z.classList.remove('is-over', 'is-bad'); });
}
function onDragStart(e) {
  if (ppMenuOpen()) { closePpMenu(false); }
  var card = e.target && e.target.closest ? e.target.closest('.person-card') : null;
  if (!card) { return; }
  var pid = card.getAttribute('data-person-id');
  if (!personById(pid)) { e.preventDefault(); return; }
  ui.dragPersonId = pid;
  try {
    e.dataTransfer.setData('text/plain', pid);
    e.dataTransfer.effectAllowed = 'move';
  } catch (err) { /* 部分浏览器限制自定义数据，不影响本地放置 */ }
  card.classList.add('is-dragging');
  document.body.classList.add('is-dragging');
  markZones(pid);
}
function onDragOver(e) {
  if (!ui.dragPersonId) { return; }
  var zone = e.target && e.target.closest ? e.target.closest('.rr-zone') : null;
  if (!zone) { return; }
  e.preventDefault();
  try { e.dataTransfer.dropEffect = zone.classList.contains('is-bad') ? 'none' : 'move'; } catch (err) { /* ignore */ }
  if (currentZone !== zone) {
    if (currentZone) { currentZone.classList.remove('is-over'); }
    currentZone = zone;
    zone.classList.add('is-over');
  }
}
function onDragLeave(e) {
  if (!currentZone) { return; }
  var zone = e.target && e.target.closest ? e.target.closest('.rr-zone') : null;
  if (zone !== currentZone) { return; }
  if (e.relatedTarget && zone.contains(e.relatedTarget)) { return; }
  zone.classList.remove('is-over');
  currentZone = null;
}
function onDrop(e) {
  if (!ui.dragPersonId) { return; }
  var zone = e.target && e.target.closest ? e.target.closest('.rr-zone') : null;
  var pid = ui.dragPersonId;
  e.preventDefault();
  endDrag();
  if (!zone) { toast('info', '已取消放置', '把人员卡片拖到项目里的虚线岗位区域即可完成分配。'); return; }
  assignPerson(zone.getAttribute('data-project-id'), zone.getAttribute('data-req-id'), pid);
}

function togglePeoplePanel() {
  ui.peopleCollapsed = !ui.peopleCollapsed;
  el.app.setAttribute('data-people', ui.peopleCollapsed ? 'collapsed' : 'expanded');
  el.togglePeople.setAttribute('aria-expanded', ui.peopleCollapsed ? 'false' : 'true');
  var lab = ui.peopleCollapsed ? '展开人员区' : '收起人员区';
  el.togglePeople.setAttribute('aria-label', lab);
  el.togglePeople.setAttribute('title', lab);
  if (el.togglePeopleLabel) { el.togglePeopleLabel.textContent = ui.peopleCollapsed ? '展开' : '收起'; }
  announce('人员区已' + (ui.peopleCollapsed ? '收起为右侧窄条' : '展开') + '。');
}

function setProjectCollapsed(projectId, next) {
  var p = projectById(projectId);
  if (!p) { return; }
  p.collapsed = !!next;
  var safeId = String(projectId).split('"').join('');
  var card = document.querySelector('.pcard[data-project-id="' + safeId + '"]');
  if (card) {
    card.setAttribute('data-collapsed', p.collapsed ? 'true' : 'false');
    var btn = card.querySelector('[data-action="toggle-project"]');
    if (btn) {
      btn.setAttribute('aria-expanded', p.collapsed ? 'false' : 'true');
      btn.setAttribute('aria-label', (p.collapsed ? '展开' : '收起') + '项目「' + p.name + '」的岗位明细');
      btn.setAttribute('title', (p.collapsed ? '展开' : '收起') + '岗位明细');
    }
  }
  save();
  updateCollapseAllBtn();
  announce('已' + (p.collapsed ? '收起' : '展开') + '项目「' + p.name + '」的岗位明细。');
}

function toggleProjectCollapsed(projectId) {
  var p = projectById(projectId);
  if (!p) { return; }
  setProjectCollapsed(projectId, !p.collapsed);
}

function toggleAllProjects() {
  var list = state.projects;
  if (!list.length) { return; }
  var allCollapsed = list.every(function (p) { return !!p.collapsed; });
  var next = !allCollapsed;
  list.forEach(function (p) { p.collapsed = next; });
  save();
  render();
  toast('info', next ? '已收起全部项目卡片' : '已展开全部项目卡片', '共 ' + list.length + ' 个项目。');
}

function updateCollapseAllBtn() {
  if (!el.collapseAll) { return; }
  var list = state.projects;
  var allCollapsed = list.length > 0 && list.every(function (p) { return !!p.collapsed; });
  var lab = allCollapsed ? '全部展开' : '全部收起';
  var span = el.collapseAll.querySelector('.btn-label');
  if (span) { span.textContent = lab; }
  el.collapseAll.setAttribute('aria-label', lab + '所有项目卡片');
  el.collapseAll.disabled = list.length === 0;
}

function hydrateIcons() {
  var a = $('#btnNewProject .btn-ic'); if (a) { a.innerHTML = icon('folderPlus'); }
  var b = $('#btnNewPerson .btn-ic'); if (b) { b.innerHTML = icon('userPlus'); }

  var g = $('#btnCollapseAll .btn-ic'); if (g) { g.innerHTML = icon('fold'); }
  $$('.field-ic').forEach(function (n) { n.innerHTML = icon('search'); });
  var d = $('#projectsEmpty .empty-ic'); if (d) { d.innerHTML = icon('layers'); }
}

function wireEvents() {
  on($('#btnNewProject'), 'click', function () { projectDialog(null); });
  on($('#btnEmptyNewProject'), 'click', function () { projectDialog(null); });
  on($('#btnNewPerson'), 'click', function () { personDialog(null); });
  on($('#btnEmptyNewPerson'), 'click', function () { personDialog(null); });
  on($('#btnData'), 'click', function () { dataDialog(); });
  on($('#btnLegend'), 'click', function () { legendDialog(); });
  on(el.collapseAll, 'click', toggleAllProjects);
  on(el.togglePeople, 'click', togglePeoplePanel);
  on(el.importFile, 'change', function () {
    var f = el.importFile.files && el.importFile.files[0];
    el.importFile.value = '';
    if (f) { handleImportFile(f); }
  });
  on(el.projectQuery, 'input', debounce(function () { ui.projectQuery = el.projectQuery.value; render(); }, 140));
  on(el.projectStatusFilter, 'change', function () { ui.projectStatus = el.projectStatusFilter.value; render(); });
  on(el.personQuery, 'input', debounce(function () { ui.personQuery = el.personQuery.value; render(); }, 140));
  on(el.personRoleFilter, 'change', function () { ui.personRole = el.personRoleFilter.value; render(); });
  on(el.personSort, 'change', function () { ui.personSort = el.personSort.value; render(); });
  on(el.projectGrid, 'change', onProjectNameChange);
  on(el.projectGrid, 'keydown', onProjectNameKeydown);
  on(document, 'click', onActionClick);
  on(document, 'dragstart', onDragStart);
  on(document, 'dragend', endDrag);
  on(document, 'dragover', onDragOver);
  on(document, 'dragleave', onDragLeave);
  on(document, 'drop', onDrop);
  on(document, 'keydown', function (e) {
    if (e.key !== 'Escape' || dialogOpen()) { return; }
    if (ppMenuOpen()) { closePpMenu(true); return; }
    if (ui.selectedPersonId) { ui.selectedPersonId = null; render(); }
  });
  on(document, 'keydown', onPpMenuKeydown);
  on(window, 'resize', function () { if (ppMenuOpen()) { closePpMenu(false); } });
  on(el.roster, 'scroll', function () { if (ppMenuOpen()) { closePpMenu(false); } });
}

function init() {
  bindEls();
  hydrateIcons();
  storageOK = probeStorage();
  var loaded = storageOK ? loadFromStorage() : null;
  if (loaded) { state = loaded; }
  else {
    state = seed();
    if (storageOK) { save(); }
  }
  wireEvents();
  render();
  if (!storageOK) {
    setTimeout(function () {
      toast('warn', '本地存储不可用', '当前浏览器拒绝了本地存储，改动不会被保存。编排完成后请用「数据 → 导出 JSON」备份。');
    }, 500);
  }
}

if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
else { init(); }
})();
</script>
</body>
</html>
