<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="在瀏覽器本機安全產生高強度隨機密碼。" />
  <title>高強度密碼產生器 | 工具箱</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">&lt;/&gt;</span><span>工具箱</span></a>
    <nav aria-label="工具導覽">
      <a href="index.html">JSON</a>
      <a href="html-preview.html">HTML</a>
      <a href="timestamp.html">Timestamp</a>
      <a href="network.html">Network</a>
      <a href="docx-email.html">Docx Email</a>
      <a href="text-encode.html">Text &amp; Encode</a>
      <a class="active" href="password-generator.html" aria-current="page">Password</a>
    </nav>
    <span class="local-note"><i></i>本機運行</span>
  </header>
  <main>
    <section class="tool-section password-section" aria-labelledby="password-title">
      <div class="section-heading"><div><h1 id="password-title">高強度密碼產生器</h1><p>密碼只在這個瀏覽器分頁的記憶體中產生與顯示，不會儲存或傳送。</p></div><output id="password-status" class="status" aria-live="polite">準備產生</output></div>
      <div class="password-result">
        <label for="password-output">新密碼</label>
        <textarea id="password-output" readonly spellcheck="false" aria-label="產生的密碼"></textarea>
        <div class="password-result-meta"><strong id="password-result-length">長度：0 個字元</strong><button id="copy-password" class="icon-button" type="button" title="複製密碼" aria-label="複製密碼">⧉</button></div>
      </div>
      <form id="password-settings" class="password-settings" novalidate>
        <label for="password-length">密碼長度<input id="password-length" type="number" min="12" max="128" value="16" inputmode="numeric" aria-describedby="password-guidance password-error" /></label>
        <fieldset><legend>包含字元</legend><div class="category-options">
          <label><input name="category" type="checkbox" value="uppercase" checked /> 大寫英文 A–Z</label>
          <label><input name="category" type="checkbox" value="lowercase" checked /> 小寫英文 a–z</label>
          <label><input name="category" type="checkbox" value="numbers" checked /> 數字 0–9</label>
          <label><input name="category" type="checkbox" value="symbols" checked /> 符號 ! @ #</label>
        </div></fieldset>
        <p id="password-error" class="error-message" role="alert"></p>
        <p id="password-guidance" class="password-guidance" aria-live="polite"></p>
        <div class="action-row"><button id="regenerate-password" class="primary" type="button">重新產生</button><button type="submit">套用設定並產生</button></div>
      </form>
    </section>
  </main>
  <footer>工具箱 · 密碼不會離開你的裝置</footer>
  <script type="module" src="password-generator.js"></script>
</body>
</html>
